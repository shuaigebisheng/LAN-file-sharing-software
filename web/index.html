<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>局域网互传</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <div>
        <h1>局域网互传</h1>
        <p class="sub" id="meLabel">正在识别设备…</p>
      </div>
    </div>
    <div class="peer-pill" id="peerPill" hidden>
      <span class="dot"></span>
      <span id="peerPillText">0 台设备在线</span>
    </div>
  </header>

  <section class="card send-card">
    <div class="card-head">
      <h2>发送文件</h2>
    </div>

    <div class="send-target">
      <span class="send-target-label">发送给</span>
      <div class="target-dropdown" id="targetDropdown">
        <button type="button" class="target-btn" id="targetBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="target-btn-text" id="targetBtnText">所有人（共享）</span>
          <svg class="target-btn-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l4 4 4-4"/></svg>
        </button>
        <ul class="target-menu" id="targetMenu" hidden role="listbox"></ul>
      </div>
      <select id="targetSelect" hidden>
        <option value="__none__" selected>请选择接收者…</option>
        <option value="">所有人（共享）</option>
      </select>
    </div>

    <label class="dropzone" id="dropzone" for="fileInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span class="dz-label">点击选择文件</span>
      <span class="dz-hint">或拖拽文件到页面任意位置</span>
    </label>
    <input type="file" id="fileInput" multiple hidden>

    <div class="queue" id="queuePanel" hidden>
      <div class="queue-head">
        <span class="queue-summary" id="queueSummary"></span>
        <div class="queue-actions">
          <button class="mini-btn" id="pauseAllBtn">全部暂停</button>
          <button class="mini-btn" id="resumeAllBtn">全部继续</button>
          <button class="mini-btn" id="clearDoneBtn">清除已完成</button>
          <button class="mini-btn" id="clearAllBtn">全部清除</button>
        </div>
      </div>
      <ul class="queue-list" id="queueList"></ul>
    </div>
  </section>

  <section class="card files-card">
    <div class="card-head">
      <h2>共享文件</h2>
      <div class="card-head-actions">
        <div class="file-head-normal" id="fileHeadNormal">
          <span class="badge" id="fileCount">0</span>
          <button type="button" class="files-select-btn" id="fileSelectBtn" title="多选">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span class="files-select-btn-text">多选</span>
          </button>
        </div>
        <div class="file-head-select" id="fileHeadSelect" hidden>
          <span class="files-selected-info" id="fileSelectedInfo">已选 0 项</span>
          <button type="button" class="mini-btn" id="fileSelectAllBtn">全选</button>
          <button type="button" class="mini-btn primary" id="fileZipBtn" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="file-zip-text">打包下载</span>
          </button>
          <button type="button" class="files-select-btn" id="fileSelectExitBtn" title="退出多选">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="files-toolbar">
      <div class="files-search">
        <svg class="files-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="fileSearch" placeholder="搜索文件名…" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="files-search-clear" id="fileSearchClear" hidden aria-label="清除">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="files-sort" id="fileSortDropdown">
        <button type="button" class="files-sort-btn" id="fileSortBtn" aria-haspopup="listbox" aria-expanded="false" title="排序">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
          <span id="fileSortLabel">最新上传</span>
          <svg class="files-sort-arrow" width="10" height="6" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l4 4 4-4"/></svg>
        </button>
        <ul class="files-sort-menu" id="fileSortMenu" hidden role="listbox"></ul>
      </div>
    </div>

    <div class="files-tabs" id="fileTabs" role="tablist">
      <button type="button" class="files-tab is-active" data-cat="all" role="tab">
        <span>全部</span><span class="files-tab-count" data-cat-count="all">0</span>
      </button>
      <button type="button" class="files-tab" data-cat="img" role="tab">
        <span>图片</span><span class="files-tab-count" data-cat-count="img">0</span>
      </button>
      <button type="button" class="files-tab" data-cat="vid" role="tab">
        <span>视频</span><span class="files-tab-count" data-cat-count="vid">0</span>
      </button>
      <button type="button" class="files-tab" data-cat="aud" role="tab">
        <span>音频</span><span class="files-tab-count" data-cat-count="aud">0</span>
      </button>
      <button type="button" class="files-tab" data-cat="doc" role="tab">
        <span>文档</span><span class="files-tab-count" data-cat-count="doc">0</span>
      </button>
      <button type="button" class="files-tab" data-cat="zip" role="tab">
        <span>压缩包</span><span class="files-tab-count" data-cat-count="zip">0</span>
      </button>
      <button type="button" class="files-tab" data-cat="other" role="tab">
        <span>其他</span><span class="files-tab-count" data-cat-count="other">0</span>
      </button>
    </div>

    <ul class="file-list" id="fileList"></ul>

    <div class="files-pager" id="filesPager" hidden>
      <button type="button" class="pager-btn" id="pagerFirst" title="第一页">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
      <button type="button" class="pager-btn" id="pagerPrev" title="上一页">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="pager-info" id="pagerInfo">1 / 1</span>
      <button type="button" class="pager-btn" id="pagerNext" title="下一页">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button type="button" class="pager-btn" id="pagerLast" title="最后一页">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>
    </div>
  </section>

  <footer class="foot">
    <span>只有你和接收者能看到你发送的文件</span>
  </footer>
</div>

<script src="/static/jszip.min.js"></script>
<script src="/static/docx-preview.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
